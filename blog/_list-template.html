<!DOCTYPE html>
<html lang="ko">
<!--
  목록 페이지 템플릿입니다. 허브가 이 파일을 읽어 index.html 을 만듭니다.
  바꿔 넣을 자리: {{items}}  (글 카드 <li> 들을 이어붙인 HTML)

  글 카드 <li> 하나의 형태:
    <li>
      <a href="/blog/{{slug}}/">
        <article class="post-card">
          <img class="post-thumb" src="{{image}}" alt="{{title}}" loading="lazy" width="800" height="450">
          <h2 class="post-title">{{title}}</h2>
          <p class="post-desc">{{description}}</p>
          <span class="post-date">{{date}}</span>
        </article>
      </a>
    </li>
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 | {{siteName}}</title>
<meta name="description" content="{{siteName}} 블로그입니다. 여행·예약 할인 정보를 정리한 글 모음입니다.">
<link rel="canonical" href="https://rkt.trip-offer.co.kr/blog/">
<meta property="og:type" content="website">
<meta property="og:title" content="블로그 | {{siteName}}">
<meta property="og:description" content="{{siteName}} 블로그입니다. 여행·예약 할인 정보를 정리한 글 모음입니다.">
<meta property="og:url" content="https://rkt.trip-offer.co.kr/blog/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="/blog/blog.css">
</head>
<body class="blog">
<header class="blog-top">
  <div class="blog-wrap">
    <a class="blog-brand" href="/">{{siteName}}</a>
    <nav class="blog-nav">
      <a href="/">홈</a>
      <a class="on" href="/blog/">블로그</a>
    </nav>
  </div>
</header>

<main class="blog-wrap">
  <div class="blog-head">
    <h1>블로그</h1>
    <p>여행·예약 할인 정보를 정리한 글 모음입니다.</p>
  </div>

  <!-- POSTS:START -->
  <ul class="post-list">
{{items}}
  </ul>
  <!-- POSTS:END -->
</main>

<footer class="blog-foot">
  <div class="blog-wrap">
    <span>&copy; 2026 {{siteName}}</span>
    <span><a href="/">메인으로</a></span>
  </div>
</footer>
</body>
</html>
