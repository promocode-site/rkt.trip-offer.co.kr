<!DOCTYPE html>
<html lang="ko">
<!--
  글 페이지 템플릿입니다. 허브가 이 파일을 읽어 {{slug}}/index.html 로 저장합니다.
  바꿔 넣을 자리는 README.md 의 표를 보세요.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | {{siteName}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{image}}">
<meta property="og:url" content="{{canonical}}">
<meta property="article:published_time" content="{{date_iso}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="/blog/blog.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{title}}",
  "description": "{{description}}",
  "image": "{{image}}",
  "datePublished": "{{date_iso}}",
  "dateModified": "{{date_iso}}",
  "mainEntityOfPage": "{{canonical}}",
  "publisher": { "@type": "Organization", "name": "{{siteName}}" }
}
</script>
</head>
<body class="blog">
<header class="blog-top">
  <div class="blog-wrap">
    <a class="blog-brand" href="/">{{siteName}}</a>
    <nav class="blog-nav">
      <a href="/">홈</a>
      <a class="on" href="/blog/">블로그</a>
    </nav>
  </div>
</header>

<main class="blog-wrap">
  <article class="post-article">
    <span class="post-meta"><time datetime="{{date_iso}}">{{date}}</time></span>
    <h1>{{title}}</h1>

    <img class="post-hero" src="{{image}}" alt="{{title}}" width="1200" height="675">

    <div class="post-content">
{{body}}
    </div>

    <!-- 같은 사이트 다른 글 링크 자리 -->
    <section class="post-related">
      <h2>함께 보면 좋은 글</h2>
      <ul>
{{related}}
      </ul>
    </section>

    <a class="back-link" href="/blog/">← 블로그 목록으로</a>
  </article>
</main>

<footer class="blog-foot">
  <div class="blog-wrap">
    <span>&copy; 2026 {{siteName}}</span>
    <span><a href="/">메인으로</a></span>
  </div>
</footer>
</body>
</html>
